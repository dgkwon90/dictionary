[package]
name = "neulsang"
version = "0.1.1"
description = "Neulsang(늘상) 데스크톱 UI 셸"
authors = ["dgkwon90"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neulsang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
log = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# 기동 확인(startup.rs) 테스트는 async 함수를 직접 돌려야 해서 런타임과 #[tokio::test]가
# 필요하다. 런타임 자체는 tauri가 이미 끌고 오지만, 여기서 쓰는 기능은 명시해 둔다.
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 알림 클릭을 받기 위해 macOS에서만 직접 쓴다(notifications.rs의 `mac` 모듈 주석 참고).
# 새 의존성처럼 보이지만 이미 tauri-plugin-notification → notify-rust를 통해 트리에
# 들어와 있던 크레이트다. **버전이 갈리면 안 된다** — 델리게이트와 PENDING 맵이
# 크레이트 전역 static이라, 사본이 둘이면 클릭 응답이 다른 쪽 맵으로 가서 사라진다.
mac-notification-sys = "0.6"
